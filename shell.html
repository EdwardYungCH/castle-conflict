<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Castle Conflict">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="pwa/manifest.webmanifest">
<link rel="apple-touch-icon" href="pwa/apple-touch-icon.png">
<link rel="icon" type="image/png" href="pwa/icon-192.png">
<title>Castle Conflict</title>
<style>
:root{color-scheme:dark;--bg:#0d0f12;--ink:#d9dccf;--soft:#8b928c;--line:#262b30}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 16px;gap:12px;flex:none}
header b{font:600 13px/1 Georgia,serif;letter-spacing:2px;color:#e8d9a0}
header small{color:var(--soft);font-size:11px;margin-left:10px;letter-spacing:0}
.tools{display:flex;gap:6px}
.tools button{font:inherit;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;min-width:38px;min-height:30px}
.tools button:hover{background:#1c2126}
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:0 16px;background:#000}
#stage:fullscreen{padding:0}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;background:#000;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
footer{flex:none;color:var(--soft);font-size:11px;padding:6px 16px;text-align:center}
@media (orientation:landscape) and (max-height:520px){header,footer{display:none}#stage{padding:0}}
</style></head>
<body>
<header><b>CASTLE CONFLICT<small>1.85 · 網頁移植 __VERSION__</small></b><div class="tools"><button id="sound" title="聲音開關" aria-label="聲音開關">🔊</button><button id="fs" title="全螢幕" aria-label="全螢幕">⛶</button></div></header>
<div id="stage"><canvas id="game" width="480" height="320" aria-label="Castle Conflict 遊戲畫面"></canvas></div>
<footer>觸控或滑鼠操作，與原版相同。鍵盤：1–9 出兵　空白鍵 暫停　Esc 退出　雙人模式中 Q–O 為紅方出兵。手機請橫向使用。</footer>
<script>/*__SCRIPT__*/</script>
<script>if("serviceWorker" in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body></html>
